<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магічний предмет</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="cards-wrap">
      <article class="item-card item-card--legendary">
        <div class="item-card__image-wrapper">
          <img
            class="item-card__image"
            src="https://tse3.mm.bing.net/th/id/OIP.1XfRmlBMt00DCkotUdoAygHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
            alt="Магічна книга"
          />
        </div>

        <div class="item-card__content">
          <p class="item-card__type">знання</p>
          <h2 class="item-card__title">Магічна книга</h2>
          <p class="item-card__description">
            Книга з рецептами зілль, що відкриває доступ до потужних інструментів
            знань.
          </p>

          <div class="item-card__meta">
            <span class="item-card__rarity">Легендарна</span>
            <span class="item-card__price">676767 ₴</span>
          </div>

          <button class="item-card__button" type="button">Купити</button>
        </div>
      </article>

      <article class="item-card">
        <div class="item-card__image-wrapper">
          <img
            class="item-card__image"
            src="https://i.ytimg.com/vi/fPyomcX4tIQ/maxresdefault.jpg"
            alt="Меч"
          />
        </div>

        <div class="item-card__content">
          <p class="item-card__type">Зброя</p>
          <h2 class="item-card__title">Меч</h2>
          <p class="item-card__description">
            Славнозвісний клинок, який висікає вогненну лінію в тіні та дарує
            герою рішучість.
          </p>

          <div class="item-card__meta">
            <span class="item-card__rarity">Міфічний</span>
            <span class="item-card__price">898000 ₴</span>
          </div>

          <button class="item-card__button" type="button">Купити</button>
        </div>
      </article>
    </div>
  </body>
</html>
